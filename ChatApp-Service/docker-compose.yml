# Local dev dependencies for ChatApp-Service (Cassandra, Redis, Kafka), plus a one-shot run of
# ChatApp-Migrations so local schema comes from the same source as staging/prod, not Spring
# Data's auto-schema (see ChatApp-Service/src/main/resources/application.yml — schema-action is
# `none` everywhere, this file is what actually creates the tables locally).
# The service itself is expected to run on the host (via ./mvnw spring-boot:run
# or the IDE), connecting to these over the published ports — it is not a
# service in this file. Defaults here match src/main/resources/application.yml.
#
# Usage: docker compose up -d

services:
  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      # cqlsh only succeeds once the node has finished bootstrapping, which
      # single-node Cassandra can take 30s+ to do — hence the long start_period.
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  # Cassandra's official image has no equivalent to Postgres's POSTGRES_DB
  # (auto-create a database on first boot), so this creates the `chatapp`
  # keyspace once cassandra is healthy, then exits. Keeps `docker compose up -d`
  # + `./mvnw spring-boot:run` a zero-config local setup, same as before.
  cassandra-init:
    image: cassandra:5.0
    depends_on:
      cassandra:
        condition: service_healthy
    entrypoint: >
      cqlsh cassandra -e
      "CREATE KEYSPACE IF NOT EXISTS chatapp WITH replication =
      {'class': 'SimpleStrategy', 'replication_factor': 1};"
    restart: "no"

  # Applies ChatApp-Migrations/migrations/*.cql once the keyspace exists, then exits — the same
  # tool (and the same schema) staging/prod would run before deploying a new service version.
  # See ../ChatApp-Migrations/DESIGN.md.
  migrations:
    build:
      context: ../ChatApp-Migrations
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
    environment:
      CASSANDRA_HOST: cassandra
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  cassandra-data:
