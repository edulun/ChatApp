spring:
  application:
    name: chatapp-service
  profiles:
    default: local # no SPRING_PROFILES_ACTIVE needed for local dev; staging/prod always set it explicitly

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
