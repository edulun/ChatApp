spring:
  application:
    name: chatapp-service
  profiles:
    default: local # no SPRING_PROFILES_ACTIVE needed for local dev; staging/prod always set it explicitly

  cassandra:
    schema-action: none # never auto-manage schema outside local (was jpa.ddl-auto=validate's intent)

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
