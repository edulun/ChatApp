# Staging — deliberately defines no spring.datasource / data.redis / kafka
# properties here. Composing a URL from ${DB_HOST}/${DB_PORT}/${DB_NAME}
# pieces (as application-local.yml does) turned out NOT to fail fast when a
# piece is missing: Spring leaves the literal "${DB_HOST}" text in the
# string, and it only blows up later as a confusing UnknownHostException at
# connection time. Relying entirely on Spring Boot's standard relaxed-binding
# env vars below gets a real, clear startup failure instead
# ("Failed to configure a DataSource: 'url' attribute is not specified...").
#
# Required env vars (set by the deployment platform, no defaults):
#   SPRING_DATASOURCE_URL       e.g. jdbc:postgresql://host:5432/chatapp
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   SPRING_DATA_REDIS_HOST
#   SPRING_DATA_REDIS_PORT
#   SPRING_KAFKA_BOOTSTRAP_SERVERS
#
# Activate with SPRING_PROFILES_ACTIVE=staging.

management:
  endpoint:
    health:
      show-details: never # no auth in front of /actuator/health yet — don't leak internals
