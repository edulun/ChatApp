# Local dev — matches docker-compose.yml's default ports/keyspace exactly.
# Every value has a fallback default, so `./mvnw spring-boot:run` works with
# zero configuration once `docker compose up -d` is running (cassandra-init
# creates the `chatapp` keyspace itself — see docker-compose.yml).

spring:
  cassandra:
    contact-points: ${CASSANDRA_HOST:127.0.0.1} # not "localhost": it resolves to both IPv4 and
      # IPv6 loopback, and the driver logs a spurious local-DC mismatch warning on the IPv6 one
    port: ${CASSANDRA_PORT:9042}
    local-datacenter: ${CASSANDRA_DC:datacenter1} # default DC name for the official single-node image
    keyspace-name: ${CASSANDRA_KEYSPACE:chatapp}
    schema-action: create_if_not_exists

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoint:
    health:
      show-details: always # safe locally; staging/prod deliberately do not do this
