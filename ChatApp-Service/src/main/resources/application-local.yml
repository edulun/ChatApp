# Local dev — matches docker-compose.yml's default credentials/ports exactly.
# Every value has a fallback default, so `./mvnw spring-boot:run` works with
# zero configuration once `docker compose up -d` is running.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chatapp}
    username: ${DB_USERNAME:chatapp}
    password: ${DB_PASSWORD:chatapp}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoint:
    health:
      show-details: always # safe locally; staging/prod deliberately do not do this
